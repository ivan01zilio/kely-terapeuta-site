<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7455b8">
<title>Painel Admin | Kely Terapeuta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--violet:#7455b8;--violet2:#9b86d2;--soft:#f0ebfb;--navy:#182036;--ink:#293245;--muted:#6d7483;--line:#e8e2ef;--green:#295f48;--danger:#a33c45;--bg:#f8f5ff}
*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;background:linear-gradient(180deg,#f8f5ff,#fbfaf7);color:var(--ink);min-height:100vh}.wrap{max-width:1180px;margin:0 auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.brand{display:flex;align-items:center;gap:10px;color:var(--violet);font-weight:800}.dot{width:12px;height:12px;border-radius:50%;background:var(--violet);box-shadow:0 0 0 7px var(--soft)}h1,h2,h3{font-family:'Playfair Display',serif;margin:0;color:var(--violet)}h1{font-size:clamp(34px,5vw,54px)}.card{background:#fff;border:1px solid rgba(116,85,184,.13);border-radius:24px;padding:22px;box-shadow:0 18px 50px rgba(47,35,84,.08)}.login{max-width:520px;margin:8vh auto 0}.lead{color:#596173;line-height:1.6}.input{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;font-size:16px;outline:none}.input:focus{border-color:var(--violet);box-shadow:0 0 0 4px var(--soft)}.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:800;cursor:pointer;font-family:inherit}.primary{background:var(--violet);color:#fff;width:100%;margin-top:12px}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.error{color:var(--danger);font-size:14px;margin-top:10px}.hidden{display:none!important}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:18px 0}.count{font-weight:800;color:var(--navy)}.search{max-width:340px}.storageStatus{margin:0 0 16px;padding:13px 16px;border-radius:14px;font-size:14px;font-weight:700;display:none}.storageStatus.ok{display:block;background:#eaf6ef;border:1px solid #cce8d8;color:#1f6548}.storageStatus.warn{display:block;background:#fff4e6;border:1px solid #f1d7ae;color:#8a5b18}.storageStatus.bad{display:block;background:#fff0f1;border:1px solid #efc7cb;color:#9d3540}.listWrap{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 14px 40px rgba(47,35,84,.06)}.listHeader,.leadRow{display:grid;grid-template-columns:1.4fr 1fr .9fr auto auto;gap:12px;align-items:center}.listHeader{padding:13px 18px;background:#faf8fd;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;border-bottom:1px solid var(--line)}.leadItem{border-bottom:1px solid var(--line)}.leadItem:last-child{border-bottom:0}.leadRow{padding:16px 18px}.leadRow:hover{background:#fcfbfe}.name{font-weight:800;color:var(--navy);font-size:17px}.waText{color:#4f586a}.date{color:var(--muted);font-size:14px}.waBtn{background:var(--green);color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}.detailBtn{background:var(--soft);color:var(--violet);white-space:nowrap}.details{display:none;padding:0 18px 20px;background:#fdfcff}.leadItem.open .details{display:block}.detailGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-top:14px}.mini{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.mini span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.mini strong{color:var(--navy)}.answers{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:4px 14px}.answer{padding:11px 0;border-bottom:1px solid #f1edf5}.answer:last-child{border-bottom:0}.q{font-size:13px;color:var(--muted);line-height:1.45}.a{font-weight:700;margin-top:4px;color:var(--navy)}.empty{text-align:center;color:var(--muted);padding:36px}.badge{display:inline-block;margin-top:12px;padding:7px 10px;border-radius:999px;background:var(--soft);color:var(--violet);font-size:12px;font-weight:800}.logout{white-space:nowrap}
@media(max-width:860px){.listHeader{display:none}.leadRow{grid-template-columns:1fr auto;gap:8px 10px}.leadRow .waText,.leadRow .date{grid-column:1}.leadRow .waBtn,.leadRow .detailBtn{grid-column:2}.leadRow .waBtn{grid-row:1/3}.detailGrid{grid-template-columns:1fr}.toolbar,.top{align-items:stretch;flex-direction:column}.search{max-width:none}.logout{width:100%}}
@media(max-width:560px){.leadRow{grid-template-columns:1fr}.leadRow .waText,.leadRow .date,.leadRow .waBtn,.leadRow .detailBtn{grid-column:1}.leadRow .waBtn{grid-row:auto}.waBtn,.detailBtn{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<section id="loginView" class="card login">
<div class="brand"><span class="dot"></span>Kely Terapeuta</div>
<h1 style="margin-top:22px">Painel administrativo</h1>
<p class="lead">Digite sua senha para acessar as análises preenchidas.</p>
<input id="password" class="input" type="password" autocomplete="current-password" placeholder="Sua senha de administrador">
<button id="loginBtn" class="btn primary">Entrar no painel</button>
<div id="loginError" class="error"></div>
</section>
<section id="adminView" class="hidden">
<div class="top"><div><div class="brand"><span class="dot"></span>Kely Terapeuta</div><h1 style="margin-top:12px">Análises recebidas</h1></div><button id="logoutBtn" class="btn ghost logout">Sair</button></div>
<div id="storageStatus" class="storageStatus"></div>
<div class="toolbar"><div id="count" class="count">Carregando...</div><input id="search" class="input search" placeholder="Buscar por nome ou WhatsApp"></div>
<div id="list"></div>
</section>
</div>
<script>
const questions=['Quando você pensa em seus pais ou responsáveis, existem situações do passado que ainda despertam emoções fortes em você?','Existe algum familiar de quem você se afastou fisicamente, mas sente que emocionalmente a relação ainda permanece muito presente?','Existe algum ex-parceiro(a) ou relacionamento anterior que ainda desperta emoções ou necessidade de respostas?','Você sente que alguma relação terminou na prática, mas emocionalmente ainda existem coisas que ficaram sem encerramento?','Experiências anteriores influenciam sua maneira de confiar, se entregar ou se relacionar?','Existe alguém que ainda ocupa seus pensamentos ou altera seu estado emocional quando é lembrado?','Existe alguma situação profissional passada que ainda provoca carga emocional?','Você percebe situações semelhantes se repetindo nos seus relacionamentos?','Existe alguma pessoa ou situação para a qual você ainda precisa provar algo, receber desculpas, reconhecimento ou resposta?','Se pudesse trabalhar hoje uma área, qual mais precisa de encerramento ou reorganização emocional?'];
let password=sessionStorage.getItem('kelyAdminPassword')||'',rows=[];
const loginView=document.getElementById('loginView'),adminView=document.getElementById('adminView'),list=document.getElementById('list'),count=document.getElementById('count'),search=document.getElementById('search'),storageStatus=document.getElementById('storageStatus');
function esc(s=''){return String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}
function digits(s=''){return String(s).replace(/\D/g,'')}
function formatDate(v){try{return new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short',timeZone:'America/Sao_Paulo'}).format(new Date(v))}catch(e){return v||''}}
function whatsappHref(v){const d=digits(v);if(!d)return'';return'https://wa.me/'+(d.startsWith('55')?d:'55'+d)}
async function loadStatus(){try{const r=await fetch('/api/admin/storage-status',{headers:{'x-admin-password':password},cache:'no-store'});if(!r.ok)return;const s=await r.json();storageStatus.className='storageStatus '+(s.persistentStorage?'ok':s.sheetsConfigured?'warn':'bad');storageStatus.textContent=s.persistentStorage?`✓ Leads protegidos no Google Sheets. ${s.sheetsCount??0} registro(s) persistente(s).`:s.sheetsConfigured?'⚠ Google Sheets configurado, mas a leitura persistente ainda não está respondendo. Os leads novos continuam no cache local até a integração ser concluída.':'⚠ Armazenamento persistente não configurado. Leads podem desaparecer após uma nova implantação.'}catch(e){}}
async function load(){const r=await fetch('/api/admin/submissions',{headers:{'x-admin-password':password},cache:'no-store'});if(r.status===401)throw new Error('Senha incorreta.');if(r.status===503)throw new Error('A senha do painel ainda não foi configurada na Hostinger.');if(!r.ok)throw new Error('Não foi possível carregar os dados.');rows=await r.json();showAdmin();render();loadStatus()}
function showAdmin(){loginView.classList.add('hidden');adminView.classList.remove('hidden')}
function toggleDetails(id,btn){const item=document.getElementById('lead-'+id);if(!item)return;item.classList.toggle('open');btn.textContent=item.classList.contains('open')?'Ocultar detalhes':'Ver detalhes'}
function render(){const term=search.value.trim().toLowerCase();const filtered=rows.filter(x=>!term||String(x.name||'').toLowerCase().includes(term)||String(x.whatsapp||'').toLowerCase().includes(term));count.textContent=`${filtered.length} análise${filtered.length===1?'':'s'} encontrada${filtered.length===1?'':'s'}`;if(!filtered.length){list.innerHTML='<div class="card empty">Nenhuma análise encontrada.</div>';return}
list.innerHTML=`<div class="listWrap"><div class="listHeader"><div>Nome</div><div>Contato</div><div>Entrada</div><div>WhatsApp</div><div>Detalhes</div></div>${filtered.map(x=>{const ans=Array.isArray(x.answers)?x.answers:[],id=esc(x.id||Math.random().toString(36).slice(2)),href=whatsappHref(x.whatsapp);return `<article class="leadItem" id="lead-${id}"><div class="leadRow"><div class="name">${esc(x.name||'Sem nome')}</div><div class="waText">${esc(x.whatsapp||'Não informado')}</div><div class="date">${formatDate(x.createdAt)}</div>${href?`<a class="btn waBtn" target="_blank" rel="noopener" href="${href}">Chamar</a>`:`<span></span>`}<button class="btn detailBtn" onclick="toggleDetails('${id}',this)">Ver detalhes</button></div><div class="details"><div class="detailGrid"><div class="mini"><span>Resultado</span><strong>${esc(x.classification||'Não informado')}</strong></div><div class="mini"><span>Área escolhida</span><strong>${esc(x.area||'Não informada')}</strong></div><div class="mini"><span>Pontuação</span><strong>${Number(x.score||0)}</strong></div></div><span class="badge">Dados da análise</span><div class="answers">${ans.map((a,i)=>`<div class="answer"><div class="q">${i+1}. ${esc(questions[i]||'Pergunta')}</div><div class="a">${esc(a?.label||'Sem resposta')}</div></div>`).join('')}</div></div></article>`}).join('')}</div>`}
document.getElementById('loginBtn').onclick=async()=>{password=document.getElementById('password').value;document.getElementById('loginError').textContent='';try{await load();sessionStorage.setItem('kelyAdminPassword',password)}catch(e){document.getElementById('loginError').textContent=e.message}};
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('loginBtn').click()});
document.getElementById('logoutBtn').onclick=()=>{sessionStorage.removeItem('kelyAdminPassword');password='';location.reload()};search.oninput=render;if(password)load().catch(()=>{sessionStorage.removeItem('kelyAdminPassword')});
</script>
</body>
</html>
