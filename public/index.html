<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7455b8">
<title>Kely Terapeuta | Análise de Vínculos Emocionais</title>
<meta name="description" content="Uma análise guiada para observar vínculos emocionais, relações e ciclos que ainda podem despertar emoções no presente.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--violet:#7455b8;--violet2:#9b86d2;--violetSoft:#f0ebfb;--navy:#182036;--ink:#293245;--muted:#687083;--cream:#fbfaf7;--line:#e9e4f0;--green:#295f48;--danger:#a33c45}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'DM Sans',sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 0%,rgba(116,85,184,.15),transparent 34%),radial-gradient(circle at 90% 100%,rgba(155,134,210,.12),transparent 28%),linear-gradient(180deg,#fff 0%,var(--cream) 100%)}
body{min-height:100vh}.wrap{min-height:100vh;display:grid;place-items:center;padding:18px}.panel{width:min(980px,100%);background:rgba(255,255,255,.95);border:1px solid rgba(116,85,184,.12);border-radius:32px;box-shadow:0 30px 90px rgba(47,35,84,.14);overflow:hidden}
.start-grid{display:grid;grid-template-columns:1.08fr .92fr;min-height:650px}.copy{padding:58px 56px;display:flex;flex-direction:column;justify-content:center}.visual{position:relative;min-height:650px;background:linear-gradient(180deg,rgba(116,85,184,.08),rgba(24,32,54,.09));overflow:hidden}.visual img{width:100%;height:100%;object-fit:cover;display:block}.visual:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,18,40,.04),rgba(20,18,40,.33))}.quote{position:absolute;z-index:2;left:28px;right:28px;bottom:26px;color:white;font-family:'Playfair Display',serif;font-size:26px;line-height:1.18;text-shadow:0 2px 18px rgba(0,0,0,.28)}
.brand{display:flex;align-items:center;gap:10px;color:var(--violet);font-weight:700;margin-bottom:28px}.brand-dot{width:12px;height:12px;border-radius:50%;background:var(--violet);box-shadow:0 0 0 7px var(--violetSoft)}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:12px;font-weight:800;color:var(--violet);margin-bottom:12px}
h1,h2,h3{font-family:'Playfair Display',serif;color:var(--violet);margin:0}h1{font-size:clamp(40px,5vw,64px);line-height:1.02}h2{font-size:clamp(32px,4.5vw,48px);line-height:1.08}h3{font-size:25px;line-height:1.2}
.lead{font-size:18px;line-height:1.65;color:#525a6b;margin:18px 0 28px}.label{display:block;font-weight:700;margin-bottom:9px}.input{width:100%;border:1.5px solid var(--line);border-radius:16px;padding:16px 17px;font-size:17px;background:#fff;outline:none}.input:focus{border-color:var(--violet);box-shadow:0 0 0 4px var(--violetSoft)}
.btn{width:100%;border:0;border-radius:17px;padding:17px 20px;font-weight:800;font-size:16px;cursor:pointer}.primary{background:var(--violet);color:#fff;margin-top:14px}.ghost{background:transparent;color:var(--muted);padding:12px;margin-top:4px}.wa{background:var(--green);color:white;margin-top:18px}
.qwrap{padding:36px 42px 40px}.progressTop{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:700;margin-bottom:9px}.progress{height:7px;background:#eeeaf6;border-radius:999px;overflow:hidden;margin-bottom:34px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--violet2));border-radius:999px}.question{font-size:clamp(24px,3.2vw,36px);line-height:1.22;color:var(--navy);font-weight:700;margin:0 0 24px}.options{display:grid;gap:12px}.option{border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:17px 18px;border-radius:17px;text-align:left;font-size:16px;cursor:pointer}.option:hover{border-color:var(--violet);background:var(--violetSoft)}
.error{color:var(--danger);font-size:14px;margin-top:10px}.small{font-size:12px;color:var(--muted);line-height:1.5;margin-top:14px}
.resultHero{background:linear-gradient(135deg,var(--violetSoft),#fff);border:1px solid rgba(116,85,184,.15);border-radius:22px;padding:22px;margin:18px 0}.resultHero .big{font-size:28px;font-weight:800;color:var(--navy);margin-top:8px}.resultBadge{display:inline-flex;background:#fff;color:var(--violet);font-weight:800;padding:8px 13px;border-radius:999px;border:1px solid rgba(116,85,184,.16)}
.resultSection{margin-top:26px}.resultSectionTitle{font-size:14px;text-transform:uppercase;letter-spacing:.12em;color:var(--violet);font-weight:800;margin-bottom:12px}
.focusCard{border:1px solid var(--line);border-radius:20px;background:#fff;padding:18px;margin:12px 0;box-shadow:0 10px 28px rgba(47,35,84,.05)}.focusTop{display:flex;justify-content:space-between;gap:12px;align-items:center}.focusTitle{font-weight:800;color:var(--navy);font-size:17px}.focusLevel{font-size:12px;font-weight:800;color:var(--violet);background:var(--violetSoft);padding:6px 10px;border-radius:999px;white-space:nowrap}.meter{height:8px;background:#eeeaf6;border-radius:999px;overflow:hidden;margin:12px 0}.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--violet2),var(--violet));border-radius:999px}.focusText{color:#525a6b;line-height:1.6;margin:0}
.areaCard{border:2px solid rgba(116,85,184,.18);background:linear-gradient(180deg,#fff,var(--violetSoft));border-radius:20px;padding:20px}.areaName{font-family:'Playfair Display',serif;color:var(--violet);font-size:30px;font-weight:700;margin-top:5px}
.integrated{border-left:4px solid var(--violet);padding:4px 0 4px 16px;color:#525a6b;line-height:1.7}
.fade{animation:fade .28s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
footer{text-align:center;color:#7c8390;font-size:12px;padding:14px 10px 0}.privacy{border:0;background:none;color:var(--violet);text-decoration:underline;cursor:pointer}.modal{position:fixed;inset:0;background:rgba(18,22,37,.56);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.open{display:flex}.modalBox{position:relative;background:white;width:min(520px,100%);border-radius:22px;padding:28px}.close{position:absolute;right:16px;top:10px;border:0;background:none;font-size:28px;color:var(--muted);cursor:pointer}
@media(max-width:780px){.wrap{padding:10px;place-items:start center}.panel{border-radius:24px}.start-grid{grid-template-columns:1fr}.copy{padding:34px 22px 28px}.visual{min-height:330px;order:-1}.visual img{height:330px}.quote{font-size:22px}.qwrap{padding:28px 20px 30px}.lead{font-size:16px}.focusTop{align-items:flex-start;flex-direction:column}.focusLevel{white-space:normal}}
</style>
</head>
<body>
<div class="wrap"><div><main class="panel" id="app"></main><footer><button class="privacy" id="privacyBtn">Privacidade</button> · Ferramenta de reflexão, não diagnóstico.</footer></div></div>
<audio id="bgMusic" loop preload="auto"><source src="/Deixo%20Ir.mp3" type="audio/mpeg"></audio>
<div class="modal" id="privacyModal"><div class="modalBox"><button class="close" id="closePrivacy">×</button><h3>Privacidade</h3><p>Os dados informados são usados para gerar seu resultado e, quando autorizado, permitir contato relacionado ao atendimento da Kely pelo WhatsApp.</p><p>Esta análise não constitui diagnóstico psicológico, médico ou psiquiátrico.</p></div></div>
<script>
const CONFIG={whatsapp:'5547996024629',image:'/ChatGPT%20Image%2010%20de%20set.%20de%202026,%2014_10_38.png'};
const questions=[
{text:'Quando você pensa em seus pais ou responsáveis, existem situações do passado que ainda despertam emoções fortes em você?',options:[['Não',0],['Às vezes',1],['Frequentemente',2],['Sim, intensamente',3]]},
{text:'Existe algum familiar — pai, mãe, irmão, filho ou outro — de quem você se afastou fisicamente, mas sente que emocionalmente a relação ainda permanece muito presente?',options:[['Não',0],['Talvez',1],['Sim',2],['Sim, muito',3]]},
{text:'Existe algum ex-parceiro(a), ex-marido/esposa ou relacionamento anterior que ainda desperta saudade, raiva, mágoa, culpa, ciúme ou necessidade de respostas?',options:[['Não',0],['Levemente',1],['Frequentemente',2],['Sim, intensamente',3]]},
{text:'Você sente que alguma relação terminou na prática, mas emocionalmente ainda existem coisas que ficaram sem encerramento?',options:[['Não',0],['Talvez',1],['Sim',2],['Sim, claramente',3]]},
{text:'Ao iniciar ou pensar em um novo relacionamento, você percebe que experiências anteriores influenciam sua maneira de confiar, se entregar ou se relacionar?',options:[['Não',0],['Um pouco',1],['Bastante',2],['Muito',3]]},
{text:'Existe alguém que, mesmo não fazendo mais parte da sua rotina, ainda ocupa seus pensamentos ou altera seu estado emocional quando é lembrado?',options:[['Não',0],['Às vezes',1],['Frequentemente',2],['Quase sempre',3]]},
{text:'Em relação ao trabalho, existe alguma empresa, sociedade, chefe, funcionário, cliente ou situação profissional passada que ainda provoca raiva, frustração, culpa, sensação de injustiça ou necessidade de reconhecimento?',options:[['Não',0],['Levemente',1],['Bastante',2],['Muito',3]]},
{text:'Você percebe situações semelhantes se repetindo nos seus relacionamentos familiares, amorosos ou profissionais?',options:[['Não percebo',0],['Talvez',1],['Algumas vezes',2],['Sim, claramente',3]]},
{text:'Existe alguma pessoa ou situação para a qual você sente que ainda precisa provar algo, receber um pedido de desculpas, ser reconhecido ou obter alguma resposta para conseguir seguir em frente?',options:[['Não',0],['Talvez',1],['Sim',2],['Sim, fortemente',3]]},
{text:'Se você pudesse trabalhar hoje apenas UMA área da sua vida, qual sente que mais precisa de encerramento ou reorganização emocional?',options:[['Pai ou mãe',null],['Irmãos ou familiares',null],['Relacionamento atual',null],['Ex-relacionamento',null],['Trabalho ou empresa anterior',null],['Sociedade ou parceria profissional',null],['Outra situação do passado',null],['Não consigo identificar',null]]}
];
const focusMeta=[
['Relação com pais ou responsáveis','Sua resposta mostra quanto situações ligadas aos seus pais ou responsáveis ainda despertam emoções no presente.'],
['Vínculos familiares ainda presentes','Aqui observamos se algum vínculo familiar continua ocupando espaço emocional mesmo com distância ou mudança na relação.'],
['Ex-relacionamentos','Este ponto observa se relações anteriores ainda despertam saudade, mágoa, culpa, ciúme, raiva ou necessidade de respostas.'],
['Ciclos sem encerramento','Sua resposta indica o quanto existe sensação de algo emocionalmente inacabado em uma relação que já mudou ou terminou.'],
['Influência do passado nos relacionamentos','Este ponto mostra quanto experiências anteriores ainda influenciam confiança, entrega ou forma de se relacionar hoje.'],
['Pessoas que ainda alteram seu estado emocional','Aqui observamos se alguém que não está mais presente na rotina ainda mobiliza pensamentos ou emoções com frequência.'],
['Situações profissionais anteriores','Este ponto observa se experiências de trabalho, sociedade, clientes ou empresas anteriores ainda despertam carga emocional.'],
['Padrões que parecem se repetir','Sua resposta mostra se você percebe temas semelhantes reaparecendo em relações familiares, amorosas ou profissionais.'],
['Necessidade de reconhecimento ou resposta','Este ponto observa se ainda existe desejo de explicação, reconhecimento, reparação ou fechamento em alguma situação.']
];
const app=document.getElementById('app'),music=document.getElementById('bgMusic');
let state={name:'',whatsapp:'',consent:false,q:0,answers:[]};
function esc(s=''){return String(s).replace(/[<>]/g,'').trim()}
function firstName(){return esc(state.name).split(/\s+/)[0]||'você'}
function mask(v){let d=v.replace(/\D/g,'').slice(0,11);if(d.length<=2)return d;if(d.length<=7)return`(${d.slice(0,2)}) ${d.slice(2)}`;return`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`}
function startMusic(){music.volume=.18;music.play().catch(()=>{})}
function start(){app.innerHTML=`<section class="start-grid fade"><div class="copy"><div class="brand"><span class="brand-dot"></span>Kely Terapeuta</div><div class="eyebrow">Análise guiada · 10 perguntas</div><h1>Análise de Vínculos Emocionais</h1><p class="lead">Algumas relações, situações e ciclos podem continuar despertando emoções mesmo depois de terem mudado ou terminado. Esta análise ajuda você a observar onde isso aparece com mais força hoje.</p><label class="label">Qual o seu nome completo, por gentileza?</label><input class="input" id="name" autocomplete="name" placeholder="Digite seu nome completo"><button class="btn primary" id="startBtn">Iniciar análise</button><div class="error" id="err"></div><p class="small">Leva cerca de 2 minutos. Ao iniciar, uma música suave acompanha sua experiência.</p></div><div class="visual"><img src="${CONFIG.image}" alt="Kely Terapeuta"><div class="quote">“Há histórias que terminam por fora, mas ainda pedem espaço para serem compreendidas por dentro.”</div></div></section>`;document.getElementById('startBtn').onclick=()=>{const n=esc(document.getElementById('name').value);if(n.length<3){document.getElementById('err').textContent='Por favor, informe seu nome.';return}state.name=n;startMusic();renderQ()}}
function renderQ(){const q=questions[state.q],pct=(state.q+1)*10;app.innerHTML=`<section class="qwrap fade"><div class="progressTop"><span>${state.q+1} de 10</span><span>${pct}%</span></div><div class="progress"><span style="width:${pct}%"></span></div><div class="eyebrow">Responda pensando em como você se sente hoje</div><div class="question">${q.text}</div><div class="options">${q.options.map((o,i)=>`<button class="option" data-i="${i}">${o[0]}</button>`).join('')}</div>${state.q>0?'<button class="btn ghost" id="back">← Voltar</button>':''}</section>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{const o=q.options[+b.dataset.i];state.answers[state.q]={label:o[0],score:o[1]};if(state.q===2)return whatsappStep();if(state.q===9)return finish();state.q++;renderQ()});const back=document.getElementById('back');if(back)back.onclick=()=>{state.q--;renderQ()}}
function whatsappStep(){app.innerHTML=`<section class="qwrap fade"><div class="progressTop"><span>3 de 10 concluídas</span><span>30%</span></div><div class="progress"><span style="width:30%"></span></div><div class="eyebrow">Seu resultado</div><h2>Qual é o seu WhatsApp?</h2><p class="lead">Se você autorizar, a Kely poderá entrar em contato para conversar sobre o resultado da sua análise.</p><label class="label">WhatsApp com DDD</label><input class="input" id="wa" inputmode="tel" autocomplete="tel" placeholder="(47) 99999-9999"><button class="btn primary" id="continue">Concordo e quero compartilhar</button><button class="btn ghost" id="skip">Continuar sem receber contato</button><div class="error" id="waErr"></div><button class="btn ghost" id="back">← Voltar</button></section>`;const wa=document.getElementById('wa');wa.oninput=e=>e.target.value=mask(e.target.value);document.getElementById('continue').onclick=()=>{if(wa.value.replace(/\D/g,'').length<10){document.getElementById('waErr').textContent='Informe um WhatsApp válido com DDD.';return}state.whatsapp=wa.value;state.consent=true;state.q=3;renderQ()};document.getElementById('skip').onclick=()=>{state.whatsapp='';state.consent=false;state.q=3;renderQ()};document.getElementById('back').onclick=()=>{state.q=2;renderQ()}}
function classify(s){if(s<=7)return{label:'Poucos sinais percebidos',key:'baixo'};if(s<=15)return{label:'Sinais leves',key:'leve'};if(s<=21)return{label:'Sinais moderados',key:'moderado'};return{label:'Sinais elevados',key:'elevado'}}
function level(score){return score===3?'Atenção elevada':score===2?'Atenção moderada':score===1?'Atenção leve':'Baixa intensidade'}
function width(score){return score===3?100:score===2?72:score===1?40:18}
function topItems(){return state.answers.slice(0,9).map((a,i)=>({i,score:a?.score||0,title:focusMeta[i][0],text:focusMeta[i][1]})).sort((a,b)=>b.score-a.score).slice(0,3)}
function integratedText(area,items){const names=items.filter(x=>x.score>0).map(x=>x.title.toLowerCase());if(!names.length)return`Suas respostas mostram pouca intensidade geral neste momento. Ainda assim, você escolheu ${area} como uma área que merece atenção, o que pode ser um bom ponto para uma conversa mais aprofundada.`;return`O conjunto das suas respostas chama atenção principalmente para ${names.slice(0,2).join(' e ')}. Somado à sua escolha por ${area}, isso sugere um tema importante para observar com calma: quais emoções aparecem, em que situações elas são ativadas e o que ainda parece pedir compreensão ou encerramento.`}
async function finish(){const score=state.answers.slice(0,9).reduce((s,a)=>s+(a?.score||0),0),area=state.answers[9]?.label||'Não identificada',c=classify(score),payload={...state,score,classification:c.label,area};try{await fetch('/api/submissions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})}catch(e){}renderResult(area,c)}
function renderResult(area,c){const items=topItems();app.innerHTML=`<section class="qwrap fade"><div class="brand"><span class="brand-dot"></span>Kely Terapeuta</div><div class="eyebrow">Seu mapa de vínculos emocionais</div><h2>${firstName()}, veja o que mais se destacou</h2><div class="resultHero"><span class="resultBadge">${c.label}</span><div class="big">Sua análise mostra pontos que merecem ser observados com mais atenção.</div><p class="focusText" style="margin-top:10px">O objetivo deste mapa é transformar suas respostas em uma visão mais clara dos temas que apareceram com maior intensidade.</p></div><div class="resultSection"><div class="resultSectionTitle">O que mais chamou atenção</div>${items.map((x,idx)=>`<div class="focusCard"><div class="focusTop"><div class="focusTitle">${idx+1}. ${x.title}</div><div class="focusLevel">${level(x.score)}</div></div><div class="meter"><span style="width:${width(x.score)}%"></span></div><p class="focusText">${x.text}</p></div>`).join('')}</div><div class="resultSection"><div class="resultSectionTitle">A área que você escolheu trabalhar</div><div class="areaCard"><div class="areaName">${area}</div><p class="focusText" style="margin-top:10px">Essa escolha é importante porque mostra onde você percebe, hoje, maior necessidade de encerramento, reorganização ou compreensão emocional.</p></div></div><div class="resultSection"><div class="resultSectionTitle">Leitura integrada</div><div class="integrated">${integratedText(area,items)}</div></div><div class="resultSection"><div class="resultSectionTitle">Próximo passo</div><p class="lead" style="margin-bottom:10px">Talvez o próximo passo seja compreender melhor o que essas respostas estão mostrando. Em uma conversa individual, a Kely poderá ouvir sua história e explicar quais caminhos de trabalho podem fazer sentido para você.</p></div><button class="btn wa" id="waBtn">Quero conversar com a Kely sobre meu resultado</button><button class="btn ghost" id="restart">Refazer análise</button><p class="small">Esta análise é uma ferramenta de reflexão e não constitui diagnóstico psicológico, médico ou psiquiátrico.</p></section>`;document.getElementById('waBtn').onclick=()=>{const msg=`Olá, Kely! Sou ${state.name}. Concluí minha Análise de Vínculos Emocionais. Meu resultado foi “${c.label}” e a área que escolhi foi “${area}”. Gostaria de conversar sobre meu resultado.`;window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`,'_blank')};document.getElementById('restart').onclick=()=>{state={name:'',whatsapp:'',consent:false,q:0,answers:[]};start()}}
document.getElementById('privacyBtn').onclick=()=>document.getElementById('privacyModal').classList.add('open');
document.getElementById('closePrivacy').onclick=()=>document.getElementById('privacyModal').classList.remove('open');
document.getElementById('privacyModal').onclick=e=>{if(e.target.id==='privacyModal')e.currentTarget.classList.remove('open')};
start();
</script>
</body>
</html>
